# Railway service config. Overrides dashboard build/deploy settings.
# https://docs.railway.com/reference/config-as-code
#
# Do not put `pip install` in buildCommand — that installs into the build
# layer only, and the runtime image will not have uvicorn on PATH.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "/app/.venv/bin/python -m uvicorn openavl.web.app:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
