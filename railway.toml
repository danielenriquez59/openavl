# Railway service config. Overrides dashboard build/deploy settings.
# https://docs.railway.com/reference/config-as-code

[build]
builder = "RAILPACK"
buildCommand = "pip install \".[web]\""

[deploy]
startCommand = "uvicorn openavl.web.app:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
