[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openavl"
version = "1.1.0"
description = "Python port of the AVL vortex lattice code, matching Fortran AVL 3.52 except for documented fixes"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "danielenriquez59" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.14",  # older lu_factor rejects the empty AIC of body-only models
    "matplotlib>=3.7",
    "numba>=0.58",
]

[project.urls]
Homepage = "https://github.com/danielenriquez59/openavl"
Repository = "https://github.com/danielenriquez59/openavl"
Issues = "https://github.com/danielenriquez59/openavl/issues"
Documentation = "https://danielenriquez59.github.io/openavl/user_manual.html"

[project.optional-dependencies]
jax = ["jax>=0.4.20", "jaxlib>=0.4.20"]
jax-cuda12 = ["jax[cuda12]>=0.4.20"]
dev = ["pytest>=7.0"]
web = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "python-multipart>=0.0.6",
]

[tool.setuptools]
package-dir = { "openavl" = "src" }
packages = [
    "openavl",
    "openavl.aero",
    "openavl.analysis",
    "openavl.core",
    "openavl.core.solver",
    "openavl.fileio",
    "openavl.geom",
    "openavl.geometry",
    "openavl.jax",
    "openavl.math",
    "openavl.plotting",
    "openavl.web",
    "openavl.web.examples",
    "openavl.web.static",
]

[tool.setuptools.package-data]
"openavl.web.examples" = ["*"]
"openavl.web.static" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "core: unit and module tests for solver internals and APIs",
    "integration: full end-to-end AVLSolver runs on real geometries",
    "ui: web GUI session and export helpers",
    "reference: numerically validated against Fortran binaries or AVL run-case outputs",
    "fixture: validated against stored JSON fixtures",
    "smoke: quick convergence or structural checks without tight reference tolerances",
]